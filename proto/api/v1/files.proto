syntax = "proto3";

// buf:lint:ignore PACKAGE_DIRECTORY_MATCH
package lynx.api.v1;

option go_package = "github.com/lynx-go/lynx-clean-template/genproto/api/v1;apipb";

import "google/api/annotations.proto";
import "grpcapi/v1/authz.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 服务默认 access=end_user：swagger 顶层声明 Bearer security。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt> (user session token)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  extensions: {
    key: "x-access"
    value: { string_value: "end_user" }
  }
  // 统一 default 错误响应（运行时错误体即 lynx.shared.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".lynx.shared.ErrorResponse" } }
    }
  }
};

// FilesService 提供文件上传下载的预签名 URL（当前未注册到 gRPC server；
// 服务默认档参与策略收集，保证注册后即可被启动断言覆盖）。
service FilesService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_END_USER };

  rpc GetPresignedURL(GetPresignedURLRequest) returns(GetPresignedURLResponse) {
    option (google.api.http) = {
      get: "/v1/files/presigned-urls"
    };
  }
}
message GetPresignedURLRequest {
  string category = 1;
  string mime_type = 2;
  string filename = 3;
  string file_path = 4;
  string file_id = 5;
}

message GetPresignedURLResponse {
  string presigned_url = 1;
  string file_path = 2;
  string exposed_url = 3;
  string file_id = 4;
}
