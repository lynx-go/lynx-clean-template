syntax = "proto3";

// buf:lint:ignore PACKAGE_DIRECTORY_MATCH
package lynx.api.v1;

option go_package = "github.com/lynx-go/lynx-clean-template/genproto/api/v1;apipb";

import "buf/validate/validate.proto";
import "shared/user.proto";
import "google/api/annotations.proto";
import "grpcapi/v1/authz.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

// 服务默认 access=public：swagger 顶层声明 Bearer security；ACCESS_LEVEL_PUBLIC
// 方法逐方法声明 security: [] + x-access: "public"。
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Format: Bearer <jwt> (user session token)"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
  extensions: {
    key: "x-access"
    value: { string_value: "public" }
  }
  // 统一 default 错误响应（运行时错误体即 lynx.shared.ErrorResponse），
  // 文件级声明自动填充到本文件全部 operation。
  responses: {
    key: "default"
    value: {
      description: "An unexpected error response."
      schema: { json_schema: { ref: ".lynx.shared.ErrorResponse" } }
    }
  }
};

service AuthService {
  option (grpcapi.v1.service_auth) = { default_access: ACCESS_LEVEL_PUBLIC };

  rpc Token(TokenRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/v1/token"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc SignUp(SignUpRequest) returns (SignUpResponse) {
    option (google.api.http) = {
      post: "/v1/signUp"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc VerifySignUpEmail(VerifySignUpEmailRequest) returns (VerifySignUpEmailResponse) {
    option (google.api.http) = {
      post: "/v1/verify-email"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-access"
        value: { string_value: "public" }
      }
    };
  }

  rpc ResendSignUpEmailCode(ResendSignUpEmailCodeRequest) returns (ResendSignUpEmailCodeResponse) {
    option (google.api.http) = {
      post: "/v1/resend-email-code"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {}
      extensions: {
        key: "x-access"
        value: { string_value: "public" }
      }
    };
  }
}

message TokenRequest {
  string grant_type = 1;
  string username = 2;
  string email = 3;
  string phone = 4;
  string password = 5;
  string refresh_token = 6;
}

message AuthorizePasswordRequest {
  string username = 1;
  string email = 2[(buf.validate.field).string.email = true];
  string phone = 3;
  string password = 4;
}


message TokenResponse {
  string token = 3;
  int64 expires_at = 4;
  string refresh_token = 5;
  int64 refresh_token_expires_at = 6;
  lynx.shared.User user_info = 7;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message SignUpRequest {
  string username = 1;
  string email = 2;
  string phone = 3;
  string password = 4;
  map<string, string> data = 5;
}

message SignUpResponse {
  lynx.shared.User user_info = 3;
}

message VerifySignUpEmailRequest {
  string email = 1;
  string code = 2;
}

message VerifySignUpEmailResponse {
  bool verified = 1;
}

message ResendSignUpEmailCodeRequest {
  string email = 1;
}

message ResendSignUpEmailCodeResponse {
  int64 next_retry_after_sec = 1;
}
